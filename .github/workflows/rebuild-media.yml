name: Rebuild Facebook Media

on:
  push:
    branches: [main]
    paths:
      - rebuild-request.txt

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild clean ERC image
        run: |
          mkdir -p rebuilt
          cat chunks/erc512_* > rebuilt/erc512.b64
          base64 -d rebuilt/erc512.b64 > erc-waterproofing-clean-512.jpg
          file erc-waterproofing-clean-512.jpg
          test "$(stat -c%s erc-waterproofing-clean-512.jpg)" -gt 50000

      - name: Commit rebuilt image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add erc-waterproofing-clean-512.jpg
          git commit -m "Rebuild clean ERC waterproofing image" || exit 0
          git push
