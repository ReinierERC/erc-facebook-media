name: Rebuild Facebook Media

on:
  push:
    branches: [main]
    paths:
      - rebuild-request.txt

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python3 -m pip install --user pillow

      - name: Re-encode ERC image as standard RGB JPEG
        run: |
          python3 - <<'PY'
          from PIL import Image
          src = 'erc-waterproofing-approved.jpg'
          out = 'erc-waterproofing-clean.jpg'
          img = Image.open(src).convert('RGB')
          img.thumbnail((1080, 1080), Image.Resampling.LANCZOS)
          img.save(out, 'JPEG', quality=90, optimize=True, progressive=False, subsampling=0)
          with Image.open(out) as check:
              check.verify()
          print(out)
          PY
          file erc-waterproofing-clean.jpg
          test "$(stat -c%s erc-waterproofing-clean.jpg)" -gt 10000

      - name: Commit rebuilt image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add erc-waterproofing-clean.jpg
          git commit -m "Rebuild clean ERC waterproofing image" || exit 0
          git push
